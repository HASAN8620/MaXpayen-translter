name: Cloud Translation Runner

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Translation Script
        env:
          OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
        run: python translate.py

      - name: Commit and Push Translated Files
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Agar files nahi bhi hain toh error nahi aayega (|| true)
          git add american_roman.oxt translation_checkpoint.json || true
          
          # Agar koi naya word translate nahi hua toh error nahi dega
          git commit -m "Auto-translation update from OpenRouter" || echo "No new translations to commit."
          
          # Push mein error aaye toh workflow fail nahi hoga
          git push || echo "Push failed or nothing to push."
